name: Refresh market rates and publish NextRate

on:
  schedule:
    # After the Indian AM and PM bullion price publications (UTC times).
    - cron: "15 7 * * *"
    - cron: "45 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Run collector tests
        run: python -m unittest discover -s tests -v

      - name: Fetch validated rates and retain dated history
        run: python scripts/update_rates.py

      - name: Refresh AMFI fund NAVs
        run: python scripts/update_funds.py

      - name: Produce and archive next-session outlook
        run: python scripts/forecast.py

      - name: Commit changed daily observations
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json data/forecast.json data/forecast_history.json data/funds.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh actual rates and forecast [skip ci]"
            # A source-code update may land while this scheduled job is
            # fetching market rates. Rebase the bot's data-only commit onto
            # latest main and retry, without force-pushing or losing code.
            published=false
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then
                published=true
                break
              fi
              echo "Remote moved during refresh; rebasing data commit (attempt ${attempt})"
              git fetch origin main
              git rebase -X theirs origin/main
              sleep 2
            done
            if [ "$published" != "true" ]; then
              echo "Data publication failed after retries"
              exit 1
            fi
          else
            echo "No new market observations to commit"
          fi

      - name: Validate frontend
        run: |
          node --check weights.js
          node --check buy-options.js
          node --check app.js
          node --test tests/weights.test.cjs
          node --test tests/buy-options.test.cjs
          node --test tests/ui-buy.test.cjs
          node --test tests/ui-controls.test.cjs
          node --test tests/ui-forecast.test.cjs
          test -s index.html
          test -s data/latest.json
          test -s data/funds.json
          test -s data/forecast.json
          test -s data/forecast_history.json
          test -s assets/nextrate-icon.png
          test -s assets/gold-bar.webp
          test -s assets/silver-bar.webp
          python -m json.tool data/latest.json >/dev/null
          python -m json.tool data/funds.json >/dev/null
          python -m json.tool data/history.json >/dev/null
          python -m json.tool data/forecast.json >/dev/null
          python -m json.tool data/forecast_history.json >/dev/null

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: |
          mkdir -p _site/assets _site/data
          cp index.html styles.css app.js weights.js buy-options.js _site/
          cp assets/nextrate-icon.png assets/gold-bar.webp assets/silver-bar.webp _site/assets/
          cp data/latest.json data/history.json data/forecast.json data/forecast_history.json data/funds.json _site/data/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
