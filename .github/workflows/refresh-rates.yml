name: Refresh market rates and publish NextRate

on:
  push:
    branches: [main]
    paths:
      - "scripts/update_cities.py"
      - "tests/test_city_rates.py"
      - "i18n.js"
      - "tests/i18n.test.cjs"
      - "tests/ui-cities.test.cjs"
      - "scripts/backfill_rates.py"
      - "scripts/archive_data.py"
      - "tests/test_archive_data.py"
      - "scripts/forecast_models.py"
      - "tests/test_backfill_rates.py"
      - "tests/test_forecast_models.py"
      - ".github/workflows/refresh-rates.yml"
  schedule:
    # After the Indian AM and PM bullion price publications (UTC times).
    - cron: "15 7 * * *"
    - cron: "45 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Market archiving must not be cancelled by concurrent UI-only Pages builds.
# Published source archives remain canonical; the Pages site uses recent caches.
concurrency:
  group: nextrate-market-archive
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Run collector tests
        run: python -m unittest discover -s tests -v

      - name: Fetch validated rates and retain dated history
        run: python scripts/update_rates.py

      - name: Backfill IBJA PM history from attributed archive
        run: python scripts/backfill_rates.py

      - name: Refresh dated city prices
        run: python scripts/update_cities.py

      - name: Refresh AMFI fund NAVs
        run: python scripts/update_funds.py

      - name: Verify existing lifetime archives
        run: |
          if test -s data/archive/manifest.json; then
            python scripts/archive_data.py --verify
          fi

      - name: Produce and archive next-session outlook
        run: python scripts/forecast.py

      - name: Archive every observation and compact the website cache
        run: |
          python scripts/archive_data.py
          python scripts/archive_data.py --verify

      - name: Validate frontend
        run: |
          node --check weights.js
          node --check buy-options.js
          node --check i18n.js
          node --check tools-core.js
          node --check tools-ui.js
          node --check features-core.js
          node --check features.js
          node --check source-logos.js
          node --test tests/source-logos.test.cjs
          node --test tests/features-core.test.cjs
          node --test tests/ui-features.test.cjs
          node --check chart-interaction.js
          node --check chart-ui.js
          node --test tests/chart-interaction.test.cjs
          node --check app.js
          node --check data-quality.js
          node --test tests/data-quality.test.cjs
          node --test tests/tools-core.test.cjs
          node --test tests/tools-ui.test.cjs
          node --test tests/i18n.test.cjs
          node --test tests/ui-cities.test.cjs
          node --test tests/weights.test.cjs
          node --test tests/buy-options.test.cjs
          node --test tests/ui-buy.test.cjs
          node --test tests/ui-controls.test.cjs
          node --test tests/ui-forecast.test.cjs
          test -s index.html
          test -s features.css
          test -s data/latest.json
          test -s data/funds.json
          test -s data/cities.json
          test -s data/forecast.json
          test -s data/forecast_history.json
          test -s data/archive/manifest.json
          test -s assets/nextrate-icon.png
          test -s assets/gold-bar.webp
          test -s assets/silver-bar.webp
          python -m json.tool data/latest.json >/dev/null
          python -m json.tool data/funds.json >/dev/null
          python -m json.tool data/cities.json >/dev/null
          python -m json.tool data/history.json >/dev/null
          python -m json.tool data/forecast.json >/dev/null
          python -m json.tool data/forecast_history.json >/dev/null
          python scripts/validate_publication.py

      - name: Commit changed daily observations
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Archive files are canonical; history.json and forecast_history.json
          # are only recent browser caches. Never delete annual shards.
          git add data/archive data/latest.json data/history.json data/forecast.json data/forecast_history.json data/funds.json data/cities.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh actual rates and forecast [skip ci]"
            # A source-code update may land while this scheduled job is
            # fetching market rates. Rebase the bot's data-only commit onto
            # latest main and retry, without force-pushing or losing code.
            published=false
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then
                published=true
                break
              fi
              echo "Remote moved during refresh; rebasing data commit (attempt ${attempt})"
              git fetch origin main
              git rebase -X theirs origin/main
              sleep 2
            done
            if [ "$published" != "true" ]; then
              echo "Data publication failed after retries"
              exit 1
            fi
          else
            echo "No new market observations to commit"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: |
          mkdir -p _site/assets _site/data
          cp index.html styles.css features.css app.js chart-interaction.js chart-ui.js features-core.js features.js data-quality.js source-logos.js i18n.js tools-core.js tools-ui.js weights.js buy-options.js _site/
          cp assets/nextrate-icon.png assets/gold-bar.webp assets/silver-bar.webp _site/assets/
          cp data/latest.json data/history.json data/forecast.json data/forecast_history.json data/funds.json data/cities.json _site/data/
          touch _site/.nojekyll
          python scripts/validate_publication.py --root _site --site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
