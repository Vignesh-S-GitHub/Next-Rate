name: Refresh market rates and publish NextRate

on:
  schedule:
    # Primary AM/PM checks, followed by guarded recovery slots.
    - cron: "45 7 * * *"        # 13:15 IST
    - cron: "45 13 * * *"       # 19:15 IST
    - cron: "15 8,14 * * *"    # 13:45 / 19:45 IST retry
    - cron: "45 8,14 * * *"    # 14:15 / 20:15 IST retry
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Market archiving must not be cancelled by concurrent UI-only Pages builds.
# Published source archives remain canonical; the Pages site uses recent caches.
concurrency:
  group: nextrate-market-archive
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Check session and verified scheduled-publication receipt
        id: guard
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/schedule_refresh.py --requested
          else
            python scripts/schedule_refresh.py
          fi
          printf 'NEXT_RATE_REQUESTED_SESSION=%s\n' "$(sed -n 's/^session=//p' "$GITHUB_OUTPUT" | tail -1)" >> "$GITHUB_ENV"
          printf 'NEXT_RATE_REQUESTED_DATE=%s\n' "$(sed -n 's/^date=//p' "$GITHUB_OUTPUT" | tail -1)" >> "$GITHUB_ENV"

      - name: Run collector tests
        if: steps.guard.outputs.refresh == 'true'
        run: python -m unittest discover -s tests -v

      - name: Fetch validated rates and retain dated history
        if: steps.guard.outputs.refresh == 'true'
        run: python scripts/update_rates.py

      - name: Backfill IBJA PM history from attributed archive
        if: steps.guard.outputs.refresh == 'true'
        run: python scripts/backfill_rates.py

      - name: Refresh dated city prices
        if: steps.guard.outputs.refresh == 'true'
        run: python scripts/update_cities.py

      - name: Refresh AMFI fund NAVs
        if: steps.guard.outputs.refresh == 'true'
        run: python scripts/update_funds.py

      - name: Verify existing lifetime archives
        if: steps.guard.outputs.refresh == 'true'
        run: |
          if test -s data/archive/manifest.json; then
            python scripts/archive_data.py --verify
          fi

      - name: Produce and archive next-session outlook
        if: steps.guard.outputs.refresh == 'true'
        run: python scripts/forecast.py

      - name: Archive every observation and compact the website cache
        if: steps.guard.outputs.refresh == 'true'
        run: |
          python scripts/archive_data.py
          python scripts/archive_data.py --verify

      - name: Verify frontend and publication integrity
        if: steps.guard.outputs.refresh == 'true'
        run: |
          set -eu
          for file in app.js buy-options.js chart-interaction.js chart-ui.js data-quality.js features-core.js features.js i18n.js source-logos.js weights.js; do
            node --check "$file"
          done
          node --test tests/*.test.cjs
          python scripts/validate_publication.py

      - name: Verify the requested opening or closing session
        if: steps.guard.outputs.refresh == 'true'
        run: python scripts/schedule_refresh.py --verify

      - name: Commit changed daily observations
        if: steps.guard.outputs.refresh == 'true'
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Archive files are canonical; history.json and forecast_history.json
          # are only recent browser caches. Never delete annual shards.
          git add data/archive data/latest.json data/history.json data/forecast.json data/forecast_history.json data/funds.json data/cities.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh actual rates and forecast [skip ci]"
            # A source-code update may land while this scheduled job is
            # fetching market rates. Rebase the bot's data-only commit onto
            # latest main and retry, without force-pushing or losing code.
            published=false
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then
                published=true
                break
              fi
              echo "Remote moved during refresh; rebasing data commit (attempt ${attempt})"
              git fetch origin main
              git rebase -X theirs origin/main
              sleep 2
            done
            if [ "$published" != "true" ]; then
              echo "Data publication failed after retries"
              exit 1
            fi
          else
            echo "No new market observations to commit"
          fi

      - name: Configure GitHub Pages
        if: steps.guard.outputs.refresh == 'true'
        uses: actions/configure-pages@v5

      - name: Stage verified production website
        if: steps.guard.outputs.refresh == 'true'
        run: |
          set -eu
          mkdir -p _site/assets _site/data
          cp index.html app.js chart-interaction.js chart-ui.js i18n.js weights.js buy-options.js features-core.js features.js data-quality.js source-logos.js features.css styles.css _site/
          cp assets/nextrate-icon.svg assets/nextrate-icon.png assets/apple-touch-icon.png assets/gold-bar.webp assets/silver-bar.webp _site/assets/
          cp data/latest.json data/history.json data/forecast.json data/forecast_history.json data/funds.json data/cities.json _site/data/
          touch _site/.nojekyll
          python scripts/validate_publication.py --root _site --site

      - name: Upload Pages artifact
        if: steps.guard.outputs.refresh == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        if: steps.guard.outputs.refresh == 'true'
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Verify live site after deployment
        if: steps.guard.outputs.refresh == 'true'
        run: python scripts/smoke_site.py --url "https://vignesh-s-github.github.io/Next-Rate/"

      - name: Record a verified timer and live-publication receipt
        if: steps.guard.outputs.refresh == 'true'
        run: |
          python scripts/schedule_refresh.py --record
          if test -f data/refresh_status.json; then
            git add data/refresh_status.json
            if ! git diff --cached --quiet; then
              git commit -m "ops: record verified market publication [skip ci]"
              published=false
              for attempt in 1 2 3 4; do
                if git push origin HEAD:main; then
                  published=true
                  break
                fi
                git fetch origin main
                git rebase -X theirs origin/main
                sleep 2
              done
              if [ "$published" != "true" ]; then
                echo "Publication receipt could not be saved"
                exit 1
              fi
            fi
          fi
