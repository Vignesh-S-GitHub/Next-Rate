name: Deploy NextRate to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static application
        run: |
          set -eu
          node --check weights.js
          node --check buy-options.js
          node --check i18n.js
          node --check tools-core.js
          node --check tools-ui.js
          node --check features-core.js
          node --check features.js
          node --check source-logos.js
          node --test tests/source-logos.test.cjs
          node --test tests/features-core.test.cjs
          node --test tests/ui-features.test.cjs
          node --check chart-interaction.js
          node --check chart-ui.js
          node --test tests/chart-interaction.test.cjs
          node --check app.js
          node --check data-quality.js
          node --test tests/data-quality.test.cjs
          node --test tests/tools-core.test.cjs
          node --test tests/tools-ui.test.cjs
          node --test tests/i18n.test.cjs
          node --test tests/ui-cities.test.cjs
          node --test tests/weights.test.cjs
          node --test tests/buy-options.test.cjs
          node --test tests/ui-buy.test.cjs
          node --test tests/ui-controls.test.cjs
          test -s index.html
          test -s styles.css
          test -s features.css
          test -s assets/nextrate-icon.png
          test -s assets/gold-bar.webp
          test -s assets/silver-bar.webp
          grep -q 'assets/nextrate-icon.png' index.html
          python -m unittest discover -s tests -v
          node --test tests/ui-forecast.test.cjs

      - name: Refresh dated city prices
        run: |
          python scripts/update_cities.py
          python -m json.tool data/cities.json >/dev/null

      - name: Refresh AMFI fund NAVs
        run: |
          python scripts/update_funds.py
          python -m json.tool data/funds.json >/dev/null

      - name: Backfill IBJA PM history from attributed archive
        run: |
          python scripts/backfill_rates.py
          python -m json.tool data/history.json >/dev/null

      - name: Verify existing lifetime archives
        run: |
          if test -s data/archive/manifest.json; then
            python scripts/archive_data.py --verify
          fi

      - name: Build experimental outlook from published rates
        run: |
          python scripts/forecast.py
          python -m json.tool data/forecast.json >/dev/null
          python -m json.tool data/forecast_history.json >/dev/null

      - name: Archive all verified observations and compact public data
        run: |
          python scripts/archive_data.py
          python scripts/archive_data.py --verify
          python -m json.tool data/history.json >/dev/null
          python -m json.tool data/forecast_history.json >/dev/null
          python scripts/validate_publication.py

      - name: Stage public assets
        run: |
          mkdir -p _site/assets _site/data
          cp index.html app.js chart-interaction.js chart-ui.js i18n.js tools-core.js tools-ui.js weights.js buy-options.js features-core.js features.js data-quality.js source-logos.js features.css styles.css _site/
          cp assets/nextrate-icon.png assets/gold-bar.webp assets/silver-bar.webp _site/assets/
          if test -s data/latest.json && test -s data/history.json; then
            python -m json.tool data/latest.json >/dev/null
            python -m json.tool data/history.json >/dev/null
            cp data/latest.json data/history.json data/forecast.json data/forecast_history.json data/funds.json data/cities.json _site/data/
          else
            echo "No data snapshot committed yet: frontend will display unavailable message"
          fi
          touch _site/.nojekyll
          python scripts/validate_publication.py --root _site --site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live site after deployment
        run: python scripts/smoke_site.py --url "https://vignesh-s-github.github.io/Next-Rate/"
