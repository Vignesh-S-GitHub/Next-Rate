name: Deploy NextRate to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nextrate-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview-checks' || 'github-pages' }}
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node for Worker and browser regression tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install and build the Cloudflare collector for regression checks
        run: |
          npm ci --prefix cloudflare/nextrate-scheduler
          npm run build --prefix cloudflare/nextrate-scheduler

      - name: Verify production frontend and committed market data
        run: |
          set -eu
          for file in app.js data-loader.js buy-options.js chart-interaction.js chart-ui.js data-quality.js features-core.js features.js i18n.js source-logos.js weights.js; do
            node --check "$file"
          done
          node --test tests/*.test.cjs
          python -m unittest discover -s tests -v
          python scripts/archive_data.py --verify
          python scripts/validate_publication.py

      - name: Install browser regression dependencies
        timeout-minutes: 5
        run: |
          npm ci

      - name: Exercise every tab and tool on desktop and phone
        env:
          BROWSER_CHANNEL: chrome
        run: npm run test:browser

      - name: Save failed browser check screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: test-results/
          if-no-files-found: ignore

      - name: Stage committed website without recollecting rates
        run: |
          set -eu
          mkdir -p _site/assets _site/data
          cp index.html app.js data-loader.js chart-interaction.js chart-ui.js i18n.js weights.js buy-options.js features-core.js features.js data-quality.js source-logos.js features.css styles.css _site/
          cp assets/nextrate-icon.svg assets/nextrate-icon.png assets/apple-touch-icon.png assets/gold-bar.webp assets/silver-bar.webp _site/assets/
          cp data/latest.json data/history.json data/forecast.json data/forecast_history.json data/funds.json data/cities.json _site/data/
          touch _site/.nojekyll
          python scripts/validate_publication.py --root _site --site

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
      - name: Deploy GitHub Pages
        if: github.event_name != 'pull_request'
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify published website
        if: github.event_name != 'pull_request'
        run: python scripts/smoke_site.py
