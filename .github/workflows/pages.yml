name: Deploy NextRate to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nextrate-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node for Worker and browser regression tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify production frontend and committed market data
        run: |
          set -eu
          for file in app.js data-loader.js buy-options.js chart-interaction.js chart-ui.js data-quality.js features-core.js features.js i18n.js source-logos.js weights.js; do
            node --check "$file"
          done
          node --test tests/*.test.cjs
          python -m unittest discover -s tests -v
          python scripts/archive_data.py --verify
          python scripts/validate_publication.py

      - name: Stage committed website without recollecting rates
        run: |
          set -eu
          mkdir -p _site/assets _site/data
          cp index.html app.js data-loader.js chart-interaction.js chart-ui.js i18n.js weights.js buy-options.js features-core.js features.js data-quality.js source-logos.js features.css styles.css _site/
          cp assets/nextrate-icon.svg assets/nextrate-icon.png assets/apple-touch-icon.png assets/gold-bar.webp assets/silver-bar.webp _site/assets/
          cp data/latest.json data/history.json data/forecast.json data/forecast_history.json data/funds.json data/cities.json _site/data/
          touch _site/.nojekyll
          python scripts/validate_publication.py --root _site --site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify published website
        run: python scripts/smoke_site.py
