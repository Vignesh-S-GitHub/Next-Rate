name: Deploy NextRate to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static application
        run: |
          set -eu
          node --check weights.js
          node --check buy-options.js
          node --check app.js
          node --test tests/weights.test.cjs
          node --test tests/buy-options.test.cjs
          node --test tests/ui-buy.test.cjs
          node --test tests/ui-controls.test.cjs
          test -s index.html
          test -s styles.css
          test -s assets/nextrate-icon.png
          test -s assets/gold-bar.webp
          test -s assets/silver-bar.webp
          grep -q 'assets/nextrate-icon.png' index.html
          python -m unittest discover -s tests -v
          node --test tests/ui-forecast.test.cjs

      - name: Refresh AMFI fund NAVs
        run: |
          python scripts/update_funds.py
          python -m json.tool data/funds.json >/dev/null

      - name: Backfill IBJA PM history from attributed archive
        run: |
          python scripts/backfill_rates.py
          python -m json.tool data/history.json >/dev/null

      - name: Build experimental outlook from published rates
        run: |
          python scripts/forecast.py
          python -m json.tool data/forecast.json >/dev/null
          python -m json.tool data/forecast_history.json >/dev/null

      - name: Stage public assets
        run: |
          mkdir -p _site/assets _site/data
          cp index.html app.js weights.js buy-options.js styles.css _site/
          cp assets/nextrate-icon.png assets/gold-bar.webp assets/silver-bar.webp _site/assets/
          if test -s data/latest.json && test -s data/history.json; then
            python -m json.tool data/latest.json >/dev/null
            python -m json.tool data/history.json >/dev/null
            cp data/latest.json data/history.json data/forecast.json data/forecast_history.json data/funds.json _site/data/
          else
            echo "No data snapshot committed yet: frontend will display unavailable message"
          fi
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
